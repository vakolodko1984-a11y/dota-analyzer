<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Топ игроков по GPM</title>
    <style>
        :root { --bg: #0b1120; --card-bg: rgba(30, 41, 59, 0.85); --gold: #fbbf24; --text: #f8fafc; --secondary: #94a3b8; --accent: #e11d48; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card-bg); padding: 40px; border-radius: 16px; width: 100%; max-width: 600px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        h1 { text-align: center; color: var(--gold); margin-top: 0; font-size: 28px; text-shadow: 0 0 15px rgba(251, 191, 36, 0.3); }
        
        .player-row { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid #334155; transition: 0.3s; }
        .player-row:hover { background: rgba(255,255,255,0.05); border-radius: 8px; padding-left: 10px; padding-right: 10px; margin: 0 -10px; }
        .player-row:last-child { border-bottom: none; }
        
        .rank { font-weight: 900; color: #64748b; width: 30px; font-size: 20px; text-align: center; }
        .top-1 .rank { color: var(--gold); text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        .top-2 .rank { color: #e2e8f0; }
        .top-3 .rank { color: #d97706; }

        .hero-art { 
            width: 100px; 
            height: 56px; 
            border-radius: 8px; 
            object-fit: cover; 
            object-position: top; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #475569;
        }
        
        .player-info { flex-grow: 1; display: flex; flex-direction: column; }
        .player-name { font-weight: bold; font-size: 18px; color: var(--text); margin-bottom: 4px; }
        .hero-name { font-size: 13px; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .gpm { font-weight: 900; color: #22c55e; font-size: 22px; text-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
        
        .nav-link { display: block; text-align: center; margin-top: 30px; color: var(--secondary); text-decoration: none; font-weight: bold; transition: 0.3s; }
        .nav-link:hover { color: var(--gold); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥇 Топ игроков по GPM</h1>
        
        {% for p in top_players %}
        <div class="player-row {% if loop.index == 1 %}top-1{% elif loop.index == 2 %}top-2{% elif loop.index == 3 %}top-3{% endif %}">
            <div class="rank">#{{ loop.index }}</div>
            
            <!-- Проверяем, есть ли большая картинка, иначе показываем маленькую иконку -->
            {% if p.img %}
                <img src="https://cdn.cloudflare.steamstatic.com{{ p.img }}" class="hero-art" alt="{{ p.hero }}" onerror="this.onerror=null;this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/global/dota2_logo_symbol.png';">
            {% else %}
                <img src="https://cdn.cloudflare.steamstatic.com{{ p.icon }}" class="hero-art" alt="{{ p.hero }}" onerror="this.onerror=null;this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/global/dota2_logo_symbol.png';">
            {% endif %}
            
            <div class="player-info">
                <div class="player-name">{{ p.name }}</div>
                <div class="hero-name">Играет на {{ p.hero }}</div>
            </div>
            
            <div class="gpm">{{ p.gpm }}</div>
        </div>
        {% endfor %}
        
        <a href="/" class="nav-link">← Вернуться на главную</a>
    </div>
</body>
</html>
